<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordinazioni Felpe e Magliette</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Ordinazioni Felpe e Magliette</h1>
            <p class="subtitle">Scegli il tuo prodotto e completa l'ordine</p>
        </header>

        <!-- Catalogo Prodotti -->
        <div id="catalogo">
            <h2 class="section-title">👕 Felpe</h2>
            <div id="felpe-grid" class="products-grid"></div>
            
            <h2 class="section-title">👚 Magliette per Indirizzo</h2>
            <div id="magliette-grid" class="products-grid"></div>
            
            <h2 class="section-title">🎒 Accessori</h2>
            <div id="accessori-grid" class="products-grid"></div>
        </div>

        <!-- Pulsante Guida Taglie -->
        <div style="text-align: center; margin: 30px 0;">
            <button onclick="openSizeGuide()" class="btn-size-guide">
                📏 Guida alle Taglie
            </button>
        </div>

        <!-- Modal Guida Taglie -->
        <div id="sizeGuideModal" class="modal hidden">
            <div class="modal-content" style="max-width: 900px;">
                <span class="close" onclick="closeSizeGuide()">&times;</span>
                <h2>📏 Guida alle Taglie</h2>
                
                <!-- Guida Felpe -->
                <div class="size-guide-section">
                    <h3>👕 Felpe</h3>
                    <img src="/images/guida-taglie.png" alt="Guida Taglie Felpe" class="size-guide-img" onclick="openLightbox('/images/guida-taglie.png', 'Guida Taglie Felpe', false)" onerror="this.src='https://via.placeholder.com/800x600/667eea/ffffff?text=Guida+Taglie+Felpe'">
                </div>
                
                <!-- Guida Magliette -->
                <div class="size-guide-section">
                    <h3>👚 Magliette</h3>
                    <img src="/images/taglie-magliette.png" alt="Guida Taglie Magliette" class="size-guide-img" onclick="openLightbox('/images/taglie-magliette.png', 'Guida Taglie Magliette', false)" onerror="this.src='https://via.placeholder.com/800x600/764ba2/ffffff?text=Guida+Taglie+Magliette'">
                </div>
            </div>
        </div>

        <!-- Lightbox per Immagini/Video a Schermo Intero -->
        <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
            <span class="lightbox-close">&times;</span>
            <div class="lightbox-content" onclick="event.stopPropagation()">
                <img id="lightboxImage" class="lightbox-media" style="display: none;">
                <video id="lightboxVideo" class="lightbox-media" controls style="display: none;">
                    <source id="lightboxVideoSource" type="video/mp4">
                </video>
            </div>
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>

        <!-- Modal Ordine -->
        <div id="orderModal" class="modal hidden">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                
                <div id="modalProduct" class="modal-product"></div>
                
                <!-- Anteprima Davanti/Dietro per Magliette -->
                <div id="previewToggle" class="preview-toggle hidden">
                    <button class="btn-preview active" onclick="showPreview('fronte')">Davanti</button>
                    <button class="btn-preview" onclick="showPreview('retro')">Dietro</button>
                    <img id="previewImage" src="" alt="Anteprima" style="width: 100%; max-width: 300px; margin: 20px auto; display: block; border-radius: 10px;">
                </div>
                
                <form id="orderForm">
                    <h3>Completa il tuo ordine</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome *</label>
                            <input type="text" id="nome" required placeholder="Es. Mario">
                        </div>
                        <div class="form-group">
                            <label for="cognome">Cognome *</label>
                            <input type="text" id="cognome" required placeholder="Es. Rossi">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="classe">Classe *</label>
                        <input type="text" id="classe" required placeholder="Es. 3A Informatica">
                    </div>

                    <div class="form-group">
                        <label for="taglia">Taglia *</label>
                        <select id="taglia" required>
                            <option value="">Seleziona taglia...</option>
                        </select>
                    </div>

                    <div class="order-summary">
                        <div class="summary-row">
                            <span>Totale da pagare:</span>
                            <span id="totalPrice" class="price">€0.00</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        Conferma Ordine
                    </button>
                </form>

                <div id="message" class="message hidden"></div>
            </div>
        </div>

        <footer>
            <p>Sistema gestito dal Rappresentante di Istituto</p>
            <a href="admin.html" class="admin-link">Area Amministratore</a>
        </footer>
    </div>

    <script>
        let catalogo = null;
        let prodottoSelezionato = null;

        // Carica catalogo all'avvio
        window.addEventListener('DOMContentLoaded', loadCatalogo);

        async function loadCatalogo() {
            try {
                const response = await fetch('/api/catalogo');
                catalogo = await response.json();
                
                renderFelpe(catalogo.felpe);
                renderMagliette(catalogo.magliette);
                renderAccessori(catalogo.accessori);
            } catch (error) {
                console.error('Errore caricamento catalogo:', error);
            }
        }

        function renderFelpe(felpe) {
            const grid = document.getElementById('felpe-grid');
            grid.innerHTML = '';
            
            felpe.forEach(felpa => {
                const card = createProductCard(felpa, 'felpa');
                grid.appendChild(card);
            });
        }

        function renderMagliette(magliette) {
            const grid = document.getElementById('magliette-grid');
            grid.innerHTML = '';
            
            magliette.forEach(maglietta => {
                const card = createProductCard(maglietta, 'maglietta');
                grid.appendChild(card);
            });
        }

        function renderAccessori(accessori) {
            const grid = document.getElementById('accessori-grid');
            grid.innerHTML = '';
            
            accessori.forEach(accessorio => {
                const card = createProductCard(accessorio, 'accessorio');
                grid.appendChild(card);
            });
        }

        function createProductCard(prodotto, tipo) {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            let descrizione = '';
            if (tipo === 'felpa') {
                if (prodotto.scritta) {
                    descrizione = `Colore ${prodotto.colore} con scritta ${prodotto.scritta}`;
                } else {
                    descrizione = `Colore ${prodotto.colore}`;
                }
            } else if (tipo === 'maglietta') {
                if (prodotto.indirizzo) {
                    descrizione = `Indirizzo ${prodotto.indirizzo}`;
                } else {
                    descrizione = `Colore ${prodotto.colore || 'base'}`;
                }
            } else {
                descrizione = prodotto.descrizione;
            }
            
            // Gestione video o immagine
            let mediaHTML = '';
            if (prodotto.hasVideo) {
                mediaHTML = `
                    <video autoplay loop muted playsinline onclick="openLightbox('${prodotto.video}', '${prodotto.nome}', true)" style="cursor: pointer;">
                        <source src="${prodotto.video}" type="video/mp4">
                        <img src="${prodotto.immagine}" alt="${prodotto.nome}">
                    </video>
                `;
            } else {
                mediaHTML = `<img src="${prodotto.immagine}" alt="${prodotto.nome}" onclick="openLightbox('${prodotto.immagine}', '${prodotto.nome}', false)" style="cursor: pointer;" onerror="this.src='https://via.placeholder.com/500x500/667eea/ffffff?text=Prodotto'">`;
            }
            
            card.innerHTML = `
                <div class="product-image">
                    ${mediaHTML}
                </div>
                <div class="product-info">
                    <h3 class="product-name">${prodotto.nome}</h3>
                    <p class="product-description">${descrizione}</p>
                    <div class="product-footer">
                        <span class="product-price">€${prodotto.prezzo.toFixed(2)}</span>
                        <button class="btn-order" onclick="openModalById('${prodotto.id}')">
                            Ordina
                        </button>
                    </div>
                </div>
            `;
            
            return card;
        }

        function openModalById(prodottoId) {
            console.log('🔍 openModalById chiamato con ID:', prodottoId);
            console.log('📦 Prodotti disponibili:', Object.keys(catalogoProdotti));
            
            const prodotto = catalogoProdotti[prodottoId];
            
            if (!prodotto) {
                console.error('❌ Prodotto non trovato:', prodottoId);
                alert('Errore: Prodotto non trovato. Ricarica la pagina.');
                return;
            }
            
            console.log('✅ Prodotto trovato:', prodotto);
            openModal(prodotto);
        }

        function openModal(prodotto) {
            console.log('🔍 openModal chiamata con:', prodotto);
            
            prodottoSelezionato = prodotto;
            
            try {
                // Mostra dettaglio prodotto con video o immagine
                const modalProduct = document.getElementById('modalProduct');
                
                let mediaHTML = '';
                if (prodotto.hasVideo) {
                    mediaHTML = `
                        <video autoplay loop muted playsinline controls onclick="openLightbox('${prodotto.video}', '${prodotto.nome}', true)" style="width: 120px; height: 120px; object-fit: cover; border-radius: 10px; cursor: pointer;">
                            <source src="${prodotto.video}" type="video/mp4">
                        </video>
                    `;
                } else {
                    mediaHTML = `<img src="${prodotto.immagine}" alt="${prodotto.nome}" onclick="openLightbox('${prodotto.immagine}', '${prodotto.nome}', false)" style="cursor: pointer;" onerror="this.src='https://via.placeholder.com/500x500/667eea/ffffff?text=Prodotto'">`;
                }
                
                modalProduct.innerHTML = `
                    ${mediaHTML}
                    <div>
                        <h2>${prodotto.nome}</h2>
                        <p class="modal-price">€${prodotto.prezzo.toFixed(2)}</p>
                    </div>
                `;
                
                console.log('✅ Modal product HTML creato');
                
                // Mostra anteprima davanti/dietro per magliette
                const previewToggle = document.getElementById('previewToggle');
                const previewImage = document.getElementById('previewImage');
                
                if (prodotto.id && prodotto.id.startsWith('maglietta-')) {
                    previewToggle.classList.remove('hidden');
                    previewImage.src = '/images/davanti.png';
                    // Reset pulsanti
                    document.querySelectorAll('.btn-preview').forEach(btn => btn.classList.remove('active'));
                    const firstBtn = document.querySelector('.btn-preview');
                    if (firstBtn) firstBtn.classList.add('active');
                } else {
                    previewToggle.classList.add('hidden');
                }
                
                console.log('✅ Preview toggle configurato');
                
                // Popola taglie
                const tagliaSelect = document.getElementById('taglia');
                tagliaSelect.innerHTML = '<option value="">Seleziona taglia...</option>';
                prodotto.taglie.forEach(taglia => {
                    const option = document.createElement('option');
                    option.value = taglia;
                    option.textContent = taglia;
                    tagliaSelect.appendChild(option);
                });
                
                console.log('✅ Taglie popolate:', prodotto.taglie);
                
                // Mostra prezzo
                document.getElementById('totalPrice').textContent = `€${prodotto.prezzo.toFixed(2)}`;
                
                // Mostra modal
                const modal = document.getElementById('orderModal');
                modal.classList.remove('hidden');
                
                console.log('✅ Modal mostrato');
                
            } catch (error) {
                console.error('❌ ERRORE in openModal:', error);
                alert('Errore nell\'apertura del modal: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('orderModal').classList.add('hidden');
            document.getElementById('orderForm').reset();
            document.getElementById('message').classList.add('hidden');
            prodottoSelezionato = null;
        }

        // Gestione invio ordine
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!prodottoSelezionato) return;
            
            const formData = {
                nome: document.getElementById('nome').value,
                cognome: document.getElementById('cognome').value,
                classe: document.getElementById('classe').value,
                prodottoId: prodottoSelezionato.id,
                taglia: document.getElementById('taglia').value
            };
            
            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(`✅ Ordine confermato! Totale: €${result.totale.toFixed(2)}`, 'success');
                    document.getElementById('orderForm').reset();
                    
                    setTimeout(() => {
                        closeModal();
                    }, 2000);
                } else {
                    showMessage('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('❌ Errore di connessione al server', 'error');
                console.error('Errore:', error);
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.classList.remove('hidden');
        }

        // Funzioni Guida Taglie
        function openSizeGuide() {
            document.getElementById('sizeGuideModal').classList.remove('hidden');
        }

        function closeSizeGuide() {
            document.getElementById('sizeGuideModal').classList.add('hidden');
        }

        // Funzione placeholder (per compatibilità)
        function closeWarning() {
            // Funzione vuota - avviso rimosso
        }

        // Funzione Anteprima Davanti/Dietro
        function showPreview(lato) {
            const previewImage = document.getElementById('previewImage');
            
            if (lato === 'fronte') {
                previewImage.src = '/images/davanti.png';
            } else {
                previewImage.src = prodottoSelezionato.immagine;
            }
            
            // Aggiorna pulsanti attivi
            document.querySelectorAll('.btn-preview').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Funzioni Lightbox (Visualizzazione a Schermo Intero)
        function openLightbox(src, caption, isVideo) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxVideo = document.getElementById('lightboxVideo');
            const lightboxVideoSource = document.getElementById('lightboxVideoSource');
            const lightboxCaption = document.getElementById('lightboxCaption');
            
            // Nascondi entrambi
            lightboxImage.style.display = 'none';
            lightboxVideo.style.display = 'none';
            
            if (isVideo) {
                // Mostra video
                lightboxVideoSource.src = src;
                lightboxVideo.load();
                lightboxVideo.style.display = 'block';
            } else {
                // Mostra immagine
                lightboxImage.src = src;
                lightboxImage.style.display = 'block';
            }
            
            lightboxCaption.textContent = caption;
            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Blocca scroll
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            const lightboxVideo = document.getElementById('lightboxVideo');
            
            lightbox.classList.add('hidden');
            lightboxVideo.pause(); // Ferma il video
            document.body.style.overflow = 'auto'; // Riabilita scroll
        }

        // Chiudi lightbox con ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
                closeSizeGuide();
                closeModal();
            }
        });

        // Chiudi modal cliccando fuori
        window.onclick = function(event) {
            const modal = document.getElementById('orderModal');
            const sizeModal = document.getElementById('sizeGuideModal');
            if (event.target === modal) {
                closeModal();
            }
            if (event.target === sizeModal) {
                closeSizeGuide();
            }
        }
    </script>
</body>
</html>
